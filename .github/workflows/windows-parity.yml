name: Windows shared backend validation
on:
  push:
    branches: [windows-parity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r windows/backend-requirements.txt
      - name: Fetch pinned Hermes
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git hermes
          git -C hermes checkout --detach b2aa855b626ff8688eb34b95c60ee8b6a4af3679
      - name: Install verified Vulkan SDK
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP/vulkan.exe"
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkansdk-windows-X64-1.4.357.0.exe' -OutFile $sdk
          if ((Get-FileHash $sdk -Algorithm SHA256).Hash.ToLower() -ne '81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d') { throw 'Vulkan SDK checksum mismatch' }
          $p = Start-Process $sdk -ArgumentList '--root C:\VulkanSDK\1.4.357.0 --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'SDK installer failed' }
          "VULKAN_SDK=C:\VulkanSDK\1.4.357.0" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build matching Breeze voice engine
        run: python windows/voice-build.py
      - name: Import real backend on Windows
        shell: pwsh
        run: |
          $env:JINX_STATE_DIR = "$env:RUNNER_TEMP/jinx-test"
          $env:JINX_BREEZE_LIBRARY = "$pwd/dist/voice/jinx-breeze.dll"
          $env:PYTHONUTF8 = '1'
          python windows/backend_main.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: windows-breeze-runtime
          path: dist/voice/*
          retention-days: 14
