name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Check source and core behaviour
        run: |
          python scripts/check-release.py
          python -m unittest discover -s windows -p test_parity.py -v
      - name: Install build dependencies
        run: |
          python -m pip install -r windows/requirements.txt -r windows/backend-requirements.txt
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git hermes
          git -C hermes checkout --detach b2aa855b626ff8688eb34b95c60ee8b6a4af3679
          npm ci --ignore-scripts --prefix app/avatar3d
      - name: Install verified Vulkan SDK
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP/vulkan.exe"
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkansdk-windows-X64-1.4.357.0.exe' -OutFile $sdk
          if ((Get-FileHash $sdk -Algorithm SHA256).Hash.ToLower() -ne '81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d') { throw 'Vulkan SDK checksum mismatch' }
          $p = Start-Process $sdk -ArgumentList '--root C:\VulkanSDK\1.4.357.0 --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'SDK installer failed' }
          "VULKAN_SDK=C:\VulkanSDK\1.4.357.0" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build matching Breeze voice engine
        run: python windows/voice-build.py
      - name: Freeze native Windows application
        run: python windows/build.py
      - name: Verify bundled backend and voice ABI
        shell: pwsh
        run: |
          $env:JINX_STATE_DIR = "$env:RUNNER_TEMP/jinx-backend-smoke"
          $env:PYTHONUTF8 = '1'
          & "$pwd/dist/Jinx/runtime/python.exe" "$pwd/dist/Jinx/windows/backend_main.py" --check
          if ($LASTEXITCODE -ne 0) { throw 'Shared backend check failed' }
      - name: Smoke-test frozen UI and speech libraries
        shell: pwsh
        run: |
          $env:JINX_SMOKE_REPORT = "$pwd/smoke.json"
          $env:JINX_STATE_DIR = "$env:RUNNER_TEMP/jinx-ui-smoke"
          $process = Start-Process -FilePath "$pwd/dist/Jinx/Jinx.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Frozen app timed out' }
          if ($process.ExitCode -ne 0) { throw "Frozen app failed: $($process.ExitCode)" }
          $report = Get-Content smoke.json -Raw | ConvertFrom-Json
          if (-not $report.ui -or -not $report.shared_backend -or -not $report.breeze_library) { throw 'UI/speech check failed' }
          Get-Content smoke.json
      - name: Verify real Breeze generation and PCM streaming
        shell: pwsh
        run: |
          $env:JINX_VOICE_TEST_REPORT = "$pwd/voice-runtime-smoke.json"
          & "$pwd/dist/Jinx/runtime/python.exe" "$pwd/dist/Jinx/windows/test_voice_runtime.py"
          if ($LASTEXITCODE -ne 0) { throw 'Native Breeze generation failed' }
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          if (-not (Test-Path $compiler)) { choco install nsis --yes --no-progress }
          & $compiler windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed' }
      - name: Test install and uninstall without deleting user notes
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $process = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $installed = "$env:LOCALAPPDATA/Programs/Jinx"
          if (-not (Test-Path "$installed/Jinx.exe")) { throw 'Installed executable missing' }
          $process = Start-Process "$installed/Jinx.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Installed app timed out' }
          if ($process.ExitCode -ne 0) { throw 'Installed app smoke test failed' }
          $privateData = "$env:LOCALAPPDATA/Jinx/data"
          New-Item -ItemType Directory -Force $privateData | Out-Null
          Set-Content "$privateData/preservation-test.txt" 'keep private notes'
          Start-Process "$installed/Uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$installed/Jinx.exe") { throw 'Uninstall failed' }
          if (-not (Test-Path "$privateData/preservation-test.txt")) { throw 'Uninstaller deleted private data' }
      - name: Make portable ZIP and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Jinx -DestinationPath dist/Jinx-0.3.0-preview-windows-x64-portable.zip
          $lines = Get-ChildItem dist/*-setup.exe, dist/*-portable.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content dist/SHA256SUMS-windows.txt -Encoding ascii
          python -m pip freeze | Set-Content dist/windows-build-dependencies.txt
          Copy-Item smoke.json dist/windows-smoke.json
          Copy-Item voice-runtime-smoke.json dist/voice-runtime-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: jinx-windows-preview
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS-windows.txt
            dist/windows-build-dependencies.txt
            dist/windows-smoke.json
            dist/voice-runtime-smoke.json
          retention-days: 14
